name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate configs (layer 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Validate test harnesses
        run: |
          for f in tests/harness/*.yaml; do
            esphome config "$f"
          done
      - name: Validate examples
        run: |
          printf 'wifi_ssid: testssid\nwifi_password: testpassword\nencryption_key: "%s"\nota_password: testpassword\n' \
            "$(openssl rand -base64 32)" > examples/secrets.yaml
          for f in examples/*.yaml; do
            [ "$(basename "$f")" = "secrets.yaml" ] && continue
            esphome config "$f"
          done
          rm examples/secrets.yaml

  behavioral:
    name: Host compile + behavioral tests (layers 2-3)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            tests/harness/.esphome
          key: host-build-${{ hashFiles('tests/requirements.txt') }}-${{ hashFiles('tests/harness/*.yaml', 'packages/**/*.yaml') }}
          restore-keys: |
            host-build-${{ hashFiles('tests/requirements.txt') }}-
      - run: pip install -r tests/requirements.txt
      - run: pytest tests/e2e/ -v
